name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Crear proyecto Android
        run: |
          set -e
          mkdir -p "$(dirname 'app/build.gradle')"
          cat > 'app/build.gradle' <<'EOF_FILE'
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
           namespace 'com.launcher.dd'
           compileSdk 34
           defaultConfig { applicationId 'com.launcher.dd'; minSdk 24; targetSdk 30; versionCode 1; versionName '1.0' }
           buildTypes { release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt') } }
           compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
           kotlinOptions { jvmTarget = '1.8' }
          }
          dependencies { implementation 'org.osmdroid:osmdroid-android:6.1.18' }
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'EOF_FILE'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
           <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
           <uses-permission android:name="android.permission.INTERNET"/>
           <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
           <queries><intent><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent></queries>
           <application android:label="Launcher DD" android:hardwareAccelerated="true" android:theme="@android:style/Theme.Material.NoActionBar.Fullscreen">
            <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTask" android:screenOrientation="landscape" android:resizeableActivity="true"
             android:configChanges="orientation|screenSize|keyboardHidden">
             <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.HOME"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
            </activity>
           </application>
          </manifest>
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/java/com/launcher/dd/MainActivity.kt')"
          cat > 'app/src/main/java/com/launcher/dd/MainActivity.kt' <<'EOF_FILE'
          package com.launcher.dd
          import android.Manifest
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.location.Location
          import android.location.LocationListener
          import android.location.LocationManager
          import android.media.AudioManager
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.widget.*
          import org.json.JSONArray
          import org.json.JSONObject
          import org.osmdroid.config.Configuration
          import org.osmdroid.tileprovider.tilesource.TileSourceFactory
          import org.osmdroid.util.GeoPoint
          import org.osmdroid.views.CustomZoomButtonsController
          import org.osmdroid.views.MapView
          import org.osmdroid.views.overlay.Polyline
          import org.osmdroid.views.overlay.mylocation.GpsMyLocationProvider
          import org.osmdroid.views.overlay.mylocation.MyLocationNewOverlay
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import kotlin.concurrent.thread

          class MainActivity : Activity(), LocationListener {
              private lateinit var pct: Pct; private lateinit var road: RoadView; private lateinit var map: MapView
              private lateinit var tvCity: PctText; private lateinit var tvDate: PctText; private lateinit var tvTime: PctText; private lateinit var tvAm: PctText
              private lateinit var tvFeels: PctText; private lateinit var tvWind: PctText; private lateinit var tvRise: PctText; private lateinit var tvSet: PctText
              private lateinit var tvTemp: PctText; private lateinit var tvHi: PctText; private lateinit var tvLo: PctText; private lateinit var tvCond: PctText
              private lateinit var bigIcon: ImageView; private lateinit var tvSpeed: PctText; private lateinit var tvFreq: PctText
              private lateinit var tvDest: PctText; private lateinit var tvEta: PctText; private lateinit var arrow: ImageView
              private lateinit var marker: View; private lateinit var hl: View
              private val tiles = ArrayList<Triple<PctText, ImageView, PctText>>()
              private val inners = ArrayList<ImageView>()
              private val track = Polyline(); private val routeLine = Polyline()
              private var lastW = 0L; private var lastLoc: Location? = null; private var freq = 106.2f
              private val ui = Handler(Looper.getMainLooper())
              private val prefs by lazy { getSharedPreferences("slots", MODE_PRIVATE) }
              private val radioPkgs = listOf("com.syu.radio", "com.microntek.radio", "com.android.fmradio", "com.mediatek.fmradio", "com.hct.radio", "com.qualcomm.fmradio")
              private val presetRects = listOf(intArrayOf(1760, 320, 1988, 375), intArrayOf(1994, 320, 2222, 375), intArrayOf(2228, 320, 2456, 375), intArrayOf(1760, 383, 1988, 438), intArrayOf(1994, 383, 2222, 438), intArrayOf(2228, 383, 2456, 438))
              private val presetF = floatArrayOf(88.3f, 92.7f, 98.5f, 102.0f, 104.0f, 106.2f)
              private val WH = Color.WHITE

              private fun txt(l: Int, t: Int, r: Int, b: Int, k: Float, col: Int = WH, g: Int = Gravity.CENTER_VERTICAL or Gravity.START, bold: Boolean = true) = PctText(this, k, col, bold, g).also { pct.add(it, l, t, r, b) }
              private fun img(l: Int, t: Int, r: Int, b: Int, res: Int = 0) = ImageView(this).apply { scaleType = ImageView.ScaleType.FIT_CENTER; if (res != 0) setImageResource(res) }.also { pct.add(it, l, t, r, b) }
              private fun hit(l: Int, t: Int, r: Int, b: Int, onClick: () -> Unit, onLong: (() -> Unit)? = null) = View(this).apply {
                  setOnClickListener { onClick() }; if (onLong != null) setOnLongClickListener { onLong(); true }
              }.also { pct.add(it, l, t, r, b) }
              private fun f1(f: Float) = String.format(Locale.US, "%.1f", f)
              private fun go(a: String) { try { startActivity(Intent(a)) } catch (e: Exception) { } }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  Configuration.getInstance().userAgentValue = packageName
                  pct = Pct(this); setContentView(pct)
                  pct.add(ImageView(this).apply { scaleType = ImageView.ScaleType.FIT_XY; setImageResource(R.drawable.bg) }, 0, 0, 2576, 1450)
                  val C = Gravity.CENTER
                  tvCity = txt(160, 66, 330, 104, 0.8f); tvDate = txt(155, 122, 380, 153, 0.82f)
                  tvTime = txt(75, 172, 365, 268, 1.0f); tvAm = txt(378, 222, 450, 262, 0.8f)
                  tvFeels = txt(125, 276, 330, 300, 0.85f); tvWind = txt(125, 306, 330, 330, 0.85f); tvRise = txt(125, 336, 330, 360, 0.85f); tvSet = txt(125, 366, 330, 390, 0.85f)
                  bigIcon = img(440, 25, 800, 285, R.drawable.w_rain_big)
                  tvTemp = txt(510, 282, 690, 348, 1.0f, WH, C); tvHi = txt(688, 282, 758, 315, 0.9f, 0xFFFFD21F.toInt(), C); tvLo = txt(688, 315, 758, 348, 0.9f, 0xFF22D3FF.toInt(), C)
                  tvCond = txt(572, 352, 672, 392, 0.85f, WH, C)
                  val tx = intArrayOf(58, 203, 346, 489, 632)
                  for (x in tx) tiles.add(Triple(txt(x + 10, 402, x + 126, 432, 0.8f, WH, C), img(x + 14, 435, x + 122, 515, R.drawable.w_rain), txt(x + 6, 516, x + 130, 548, 0.78f, WH, C)))
                  arrow = img(100, 625, 185, 700, R.drawable.ic_turn_r)
                  txt(235, 610, 780, 655, 0.8f, 0xFFB9E7C6.toInt(), bold = false).put("Destino:")
                  tvDest = txt(235, 655, 780, 705, 0.85f); tvDest.put("Elige tu destino")
                  tvEta = txt(92, 725, 250, 762, 0.8f); tvEta.put("ETA: --:--")
                  map = MapView(this)
                  map.setTileSource(TileSourceFactory.MAPNIK); map.setMultiTouchControls(true); map.controller.setZoom(17.0); map.isTilesScaledToDpi = true
                  map.zoomController.setVisibility(CustomZoomButtonsController.Visibility.NEVER)
                  routeLine.outlinePaint.color = 0xFF2979FF.toInt(); routeLine.outlinePaint.strokeWidth = 14f
                  track.outlinePaint.color = 0x9922D3FF.toInt(); track.outlinePaint.strokeWidth = 10f
                  map.overlays.add(track); map.overlays.add(routeLine)
                  map.overlays.add(MyLocationNewOverlay(GpsMyLocationProvider(this), map).apply { enableMyLocation() })
                  pct.add(map, 62, 772, 795, 1105)
                  fun zb(s: String, t: Int, a: () -> Unit) { val z = txt(92, t, 164, t + 58, 0.9f, Color.BLACK, C); z.put(s); z.setBackgroundColor(Color.WHITE); z.setOnClickListener { a() } }
                  zb("+", 955) { map.controller.zoomIn() }; zb("−", 1020) { map.controller.zoomOut() }
                  speedInit(); road = RoadView(this); pct.add(road, 900, 735, 1690, 1190)
                  tvSpeed = txt(1120, 300, 1465, 515, 1.0f, 0xFF3DD5FF.toInt(), C); tvSpeed.put("0")
                  tvFreq = txt(1950, 215, 2205, 310, 0.95f, WH, C, false)
                  marker = View(this).apply { setBackgroundColor(0xFFFFEB3B.toInt()) }; pct.add(marker, 1780, 128, 1786, 200)
                  hl = View(this).apply { background = GradientDrawable().apply { setColor(0); setStroke(4, 0xFF22D3FF.toInt()); cornerRadius = 6f } }; pct.add(hl, 1760, 320, 1988, 375)
                  img(2260, 1000, 2410, 1150, R.drawable.ic_wifi)
                  buildDock(); buildHits()
                  setFreq(prefs.getFloat("freq", 106.2f)); tick()
                  if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED) startGps()
                  else requestPermissions(arrayOf(Manifest.permission.ACCESS_FINE_LOCATION), 1)
              }
              private fun speedInit() { }
              private fun tick() {
                  val d = Date()
                  tvTime.put(SimpleDateFormat("h:mm", Locale.ENGLISH).format(d)); tvAm.put(SimpleDateFormat("a", Locale.ENGLISH).format(d))
                  tvDate.put(SimpleDateFormat("EEEE - MMM d", Locale.ENGLISH).format(d))
                  ui.postDelayed({ tick() }, 15000L)
              }

              private fun buildHits() {
                  hit(1815, 670, 2095, 900, { go(Settings.ACTION_BLUETOOTH_SETTINGS) }); hit(2195, 670, 2475, 900, { go(Settings.ACTION_SOUND_SETTINGS) })
                  hit(1815, 955, 2095, 1190, { go(Settings.ACTION_SETTINGS) }); hit(2195, 955, 2475, 1190, { go(Settings.ACTION_WIFI_SETTINGS) })
                  hit(62, 1105, 795, 1185, { askDest() })
                  hit(1860, 215, 1960, 310, { setFreq(freq - 0.1f) }); hit(2210, 215, 2310, 310, { setFreq(freq + 0.1f) })
                  for (i in 0 until 6) { val r = presetRects[i]; hit(r[0], r[1], r[2], r[3], { setFreq(presetF[i]) }) }
                  hit(1700, 454, 1800, 518, { mute() }); hit(1820, 454, 1925, 518, { openRadio() }); hit(1944, 454, 2044, 518, { setFreq(freq - 0.1f) })
                  hit(2064, 454, 2164, 518, { openRadio() }); hit(2184, 454, 2284, 518, { setFreq(freq + 0.1f) }); hit(2304, 454, 2404, 518, { openRadio() }); hit(2420, 454, 2510, 518, { openRadio() })
                  hit(1190, 1215, 1395, 1412, { pick(-1, null) })
              }

              private fun setFreq(v: Float) {
                  freq = Math.round(v.coerceIn(87.5f, 108f) * 10) / 10f
                  tvFreq.put(f1(freq)); prefs.edit().putFloat("freq", freq).apply()
                  val x = (1780 + (freq - 87.5f) * 32.7f).toInt(); pct.move(marker, x - 3, 128, x + 3, 200)
                  for (i in 0 until 6) if (Math.abs(presetF[i] - freq) < 0.05f) { val r = presetRects[i]; pct.move(hl, r[0], r[1], r[2], r[3]); hl.visibility = View.VISIBLE; return }
                  hl.visibility = View.INVISIBLE
              }
              private fun mute() { (getSystemService(Context.AUDIO_SERVICE) as AudioManager).adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_TOGGLE_MUTE, 0) }
              private fun openRadio() {
                  radioPkgs.firstNotNullOfOrNull { packageManager.getLaunchIntentForPackage(it) }?.let { startActivity(it) }
                      ?: Toast.makeText(this, "No se encontró la app de radio del equipo", Toast.LENGTH_LONG).show()
              }

              private fun buildDock() {
                  val xs = intArrayOf(75, 285, 500, 715, 930, 1515, 1720, 1925, 2135, 2340)
                  val sc = resources.displayMetrics.widthPixels / 2576f
                  for (i in 0 until 10) {
                      val y = if (i < 5) 1262 else 1272; val x = xs[i]
                      val inner = ImageView(this).apply { scaleType = ImageView.ScaleType.FIT_CENTER; setPadding(8, 8, 8, 8)
                          background = GradientDrawable().apply { setColor(0xFF03081C.toInt()); cornerRadius = 26f * sc } }
                      pct.add(inner, x + 16, y + 16, x + 124, y + 114); inners.add(inner); refresh(i)
                      hit(x, y, x + 140, y + 130, { launchSlot(i) }, { pick(i, null) })
                  }
              }
              private fun refresh(i: Int) {
                  val v = inners[i]; val p = prefs.getString("s$i", null)
                  if (p != null) { try { v.setImageDrawable(packageManager.getApplicationIcon(p)); v.visibility = View.VISIBLE; return } catch (e: Exception) { } }
                  v.visibility = View.INVISIBLE
              }
              private fun launchSlot(i: Int) {
                  try {
                      val p = prefs.getString("s$i", null)
                      val intent = if (p != null) packageManager.getLaunchIntentForPackage(p) else when (i % 5) {
                          0 -> Intent(Intent.ACTION_DIAL)
                          1 -> Intent.makeMainSelectorActivity(Intent.ACTION_MAIN, Intent.CATEGORY_APP_MESSAGING)
                          2 -> Intent.makeMainSelectorActivity(Intent.ACTION_MAIN, Intent.CATEGORY_APP_MUSIC)
                          3 -> Intent(Settings.ACTION_SETTINGS)
                          else -> packageManager.getLaunchIntentForPackage("com.android.vending")
                      }
                      if (intent != null) startActivity(intent) else Toast.makeText(this, "App no disponible", Toast.LENGTH_SHORT).show()
                  } catch (e: Exception) { Toast.makeText(this, "App no disponible", Toast.LENGTH_SHORT).show() }
              }
              private fun pick(slot: Int, v: ImageView?) {
                  val apps = packageManager.queryIntentActivities(Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER), 0).sortedBy { it.loadLabel(packageManager).toString().lowercase() }
                  val labels = apps.map { it.loadLabel(packageManager).toString() }
                  val names = (if (slot >= 0) listOf("↺  Predeterminado") + labels else labels).toTypedArray()
                  AlertDialog.Builder(this).setTitle(if (slot < 0) "Aplicaciones" else "Elegir app").setItems(names) { _, w ->
                      if (slot < 0) packageManager.getLaunchIntentForPackage(apps[w].activityInfo.packageName)?.let { startActivity(it) }
                      else {
                          if (w == 0) prefs.edit().remove("s$slot").apply() else prefs.edit().putString("s$slot", apps[w - 1].activityInfo.packageName).apply()
                          refresh(slot)
                      }
                  }.show()
              }

              private fun askDest() {
                  val et = EditText(this); et.hint = "Av. Libertad 450"
                  AlertDialog.Builder(this).setTitle("Destino").setView(et).setPositiveButton("Ir") { _, _ -> route(et.text.toString()) }
                      .setNegativeButton("Quitar") { _, _ -> routeLine.setPoints(ArrayList<GeoPoint>()); tvDest.put("Elige tu destino"); tvEta.put("ETA: --:--"); map.invalidate() }.show()
              }
              private fun toast(s: String) = runOnUiThread { Toast.makeText(this, s, Toast.LENGTH_SHORT).show() }
              private fun httpGet(u: String): String {
                  val c = URL(u).openConnection() as HttpURLConnection
                  c.setRequestProperty("User-Agent", "LauncherDD/1.0"); c.connectTimeout = 8000; c.readTimeout = 8000
                  return c.inputStream.bufferedReader().use { it.readText() }
              }
              private fun route(q: String) = thread {
                  val l = lastLoc
                  if (l == null) { toast("Esperando señal GPS"); return@thread }
                  try {
                      val g = JSONArray(httpGet("https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + URLEncoder.encode(q, "UTF-8")))
                      if (g.length() == 0) { toast("Dirección no encontrada"); return@thread }
                      val dla = g.getJSONObject(0).getString("lat").toDouble(); val dlo = g.getJSONObject(0).getString("lon").toDouble()
                      val j = JSONObject(httpGet("https://router.project-osrm.org/route/v1/driving/${l.longitude},${l.latitude};$dlo,$dla?overview=full&geometries=geojson&steps=true")).getJSONArray("routes").getJSONObject(0)
                      val co = j.getJSONObject("geometry").getJSONArray("coordinates")
                      val pts = ArrayList<GeoPoint>()
                      for (k in 0 until co.length()) pts.add(GeoPoint(co.getJSONArray(k).getDouble(1), co.getJSONArray(k).getDouble(0)))
                      val steps = j.getJSONArray("legs").getJSONObject(0).getJSONArray("steps")
                      val mod = steps.getJSONObject(if (steps.length() > 1) 1 else 0).getJSONObject("maneuver").optString("modifier", "")
                      val ar = if (mod.contains("left")) R.drawable.ic_turn_l else if (mod.contains("right")) R.drawable.ic_turn_r else R.drawable.ic_turn_s
                      val eta = SimpleDateFormat("HH:mm", Locale.getDefault()).format(Date(System.currentTimeMillis() + (j.getDouble("duration") * 1000).toLong()))
                      runOnUiThread { routeLine.setPoints(pts); tvDest.put(q); tvEta.put("ETA: $eta"); arrow.setImageResource(ar); map.invalidate() }
                  } catch (e: Exception) { toast("No se pudo trazar la ruta") }
              }

              override fun onRequestPermissionsResult(r: Int, p: Array<out String>, g: IntArray) { if (g.isNotEmpty() && g[0] == 0) startGps() }
              private fun startGps() {
                  val lm = getSystemService(Context.LOCATION_SERVICE) as LocationManager
                  try { lm.requestLocationUpdates(LocationManager.GPS_PROVIDER, 1000L, 0f, this) } catch (e: SecurityException) { }
              }
              override fun onLocationChanged(l: Location) {
                  lastLoc = l
                  val v = if (l.hasSpeed() && l.speed * 3.6f >= 2f) l.speed * 3.6f else 0f
                  tvSpeed.put(v.toInt().toString()); road.setSpeed(v)
                  val gp = GeoPoint(l.latitude, l.longitude)
                  if (v > 0) track.addPoint(gp)
                  map.controller.animateTo(gp)
                  if (System.currentTimeMillis() - lastW > 15 * 60_000L) { lastW = System.currentTimeMillis(); loadWeather(l.latitude, l.longitude) }
              }

              private fun wRes(c: Int) = when { c == 0 -> R.drawable.w_sun; c in 1..3 || c in 45..48 -> R.drawable.w_part; else -> R.drawable.w_rain }
              private fun wText(c: Int) = when { c == 0 -> "Clear"; c <= 3 -> "Cloudy"; c < 50 -> "Foggy"; c < 70 -> "Rainy"; c < 80 -> "Snowy"; c < 90 -> "Showers"; else -> "Storm" }
              private fun t12(s: String): String { val h = s.substring(11, 13).toInt(); return "%02d:%s%s".format(if (h % 12 == 0) 12 else h % 12, s.substring(14, 16), if (h < 12) "AM" else "PM") }
              private fun loadWeather(la: Double, lo: Double) = thread {
                  try {
                      val j = JSONObject(httpGet("https://api.open-meteo.com/v1/forecast?latitude=$la&longitude=$lo&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m&daily=temperature_2m_max,temperature_2m_min,weather_code,sunrise,sunset&forecast_days=5&timezone=auto"))
                      val c = j.getJSONObject("current"); val d = j.getJSONObject("daily")
                      var city = ""
                      try { val a = JSONObject(httpGet("https://nominatim.openstreetmap.org/reverse?format=json&zoom=10&lat=$la&lon=$lo")).optJSONObject("address")
                          city = listOf("city", "town", "village", "county").firstNotNullOfOrNull { k -> a?.optString(k)?.takeIf { s -> s.isNotEmpty() } } ?: "" } catch (e: Exception) { }
                      val days = d.getJSONArray("time"); val mx = d.getJSONArray("temperature_2m_max"); val mn = d.getJSONArray("temperature_2m_min"); val wc = d.getJSONArray("weather_code")
                      val dirs = arrayOf("N", "NE", "E", "SE", "S", "SW", "W", "NW")
                      val dir = dirs[((c.getDouble("wind_direction_10m") + 22.5) / 45).toInt() % 8]
                      val code = c.getInt("weather_code")
                      runOnUiThread {
                          tvCity.put(city); bigIcon.setImageResource(if (wRes(code) == R.drawable.w_rain) R.drawable.w_rain_big else wRes(code)); tvCond.put(wText(code))
                          tvTemp.put("${Math.round(c.getDouble("temperature_2m"))}°C")
                          tvHi.put("${Math.round(mx.getDouble(0))}°"); tvLo.put("${Math.round(mn.getDouble(0))}°")
                          tvFeels.put("Feels like : ${Math.round(c.getDouble("apparent_temperature"))}°")
                          tvWind.put("Wind: $dir ${Math.round(c.getDouble("wind_speed_10m"))}km/h")
                          tvRise.put("Sunrise: ${t12(d.getJSONArray("sunrise").getString(0))}"); tvSet.put("Sunset: ${t12(d.getJSONArray("sunset").getString(0))}")
                          val inf = SimpleDateFormat("yyyy-MM-dd", Locale.US); val outf = SimpleDateFormat("EEE", Locale.ENGLISH)
                          for (i in 0 until minOf(5, tiles.size)) {
                              tiles[i].first.put(try { outf.format(inf.parse(days.getString(i))!!).uppercase() } catch (e: Exception) { "---" })
                              tiles[i].second.setImageResource(wRes(wc.getInt(i))); tiles[i].third.put("${Math.round(mx.getDouble(i))}°/${Math.round(mn.getDouble(i))}°")
                          }
                      }
                  } catch (e: Exception) { lastW = 0 }
              }
              override fun onResume() { super.onResume(); map.onResume() }
              override fun onPause() { super.onPause(); map.onPause() }
              override fun onBackPressed() {}
          }
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/java/com/launcher/dd/Views.kt')"
          cat > 'app/src/main/java/com/launcher/dd/Views.kt' <<'EOF_FILE'
          package com.launcher.dd
          import android.content.Context
          import android.graphics.*
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.TextView

          class Pct(c: Context) : ViewGroup(c) {
              private val RW = 2576f; private val RH = 1450f
              fun add(v: View, l: Int, t: Int, r: Int, b: Int): View { v.tag = floatArrayOf(l / RW, t / RH, r / RW, b / RH); addView(v); return v }
              fun move(v: View, l: Int, t: Int, r: Int, b: Int) { v.tag = floatArrayOf(l / RW, t / RH, r / RW, b / RH); requestLayout() }
              override fun onMeasure(wm: Int, hm: Int) {
                  val w = MeasureSpec.getSize(wm); val h = MeasureSpec.getSize(hm); setMeasuredDimension(w, h)
                  for (i in 0 until childCount) { val v = getChildAt(i); val t = v.tag as FloatArray
                      v.measure(MeasureSpec.makeMeasureSpec(maxOf(1, ((t[2] - t[0]) * w).toInt()), MeasureSpec.EXACTLY), MeasureSpec.makeMeasureSpec(maxOf(1, ((t[3] - t[1]) * h).toInt()), MeasureSpec.EXACTLY)) }
              }
              override fun onLayout(ch: Boolean, l: Int, t: Int, r: Int, b: Int) {
                  val w = (r - l).toFloat(); val h = (b - t).toFloat()
                  for (i in 0 until childCount) { val v = getChildAt(i); val a = v.tag as FloatArray
                      v.layout((a[0] * w).toInt(), (a[1] * h).toInt(), (a[2] * w).toInt(), (a[3] * h).toInt()) }
              }
          }

          class PctText(c: Context, private val k: Float, col: Int, bold: Boolean, g: Int) : TextView(c) {
              init { setTextColor(col); gravity = g; includeFontPadding = false; isSingleLine = true; if (bold) setTypeface(null, Typeface.BOLD) }
              fun put(s: String) { text = s; fit() }
              private fun fit() {
                  if (height <= 0 || width <= 0) return
                  var s = height * k; setTextSize(TypedValue.COMPLEX_UNIT_PX, s)
                  val str = text.toString()
                  while (paint.measureText(str) > width && s > 6f) { s *= 0.93f; setTextSize(TypedValue.COMPLEX_UNIT_PX, s) }
              }
              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) { super.onSizeChanged(w, h, ow, oh); fit() }
          }

          class RoadView(c: Context) : View(c) {
              private var speed = 0f; private var off = 0f
              private val p = Paint(Paint.ANTI_ALIAS_FLAG); private val path = Path(); private val rr = RectF()
              fun setSpeed(k: Float) { speed = k; postInvalidateOnAnimation() }
              private fun poly(vararg v: Float) { path.reset(); path.moveTo(v[0], v[1]); var i = 2; while (i < v.size) { path.lineTo(v[i], v[i + 1]); i += 2 }; path.close() }
              override fun onDraw(cv: Canvas) {
                  val w = width.toFloat(); val h = height.toFloat(); val cx = w / 2; val hz = h * 0.19f
                  p.style = Paint.Style.FILL
                  p.color = 0xFF5CC0F5.toInt(); poly(0f, hz, w * .06f, hz - h * .10f, w * .13f, hz - h * .05f, w * .22f, hz - h * .12f, w * .33f, hz - h * .04f, w * .5f, hz, w * .67f, hz - h * .04f, w * .78f, hz - h * .12f, w * .87f, hz - h * .05f, w * .95f, hz - h * .10f, w, hz); cv.drawPath(path, p)
                  p.color = 0xFF5BBF3A.toInt(); cv.drawRect(0f, hz, w, h, p)
                  p.color = 0xFF2E8B2E.toInt()
                  for (i in 0..24) { val x = w * i / 24f; if (Math.abs(x - cx) > w * 0.06f) { poly(x, hz - h * .07f, x - w * .01f, hz + 2f, x + w * .01f, hz + 2f); cv.drawPath(path, p) } }
                  p.color = 0xFFB8895A.toInt(); poly(cx - 3, hz, cx + 3, hz, w * .93f, h, w * .07f, h); cv.drawPath(path, p)
                  p.color = 0xFF555555.toInt(); poly(cx - 2, hz, cx + 2, hz, w * .87f, h, w * .13f, h); cv.drawPath(path, p)
                  p.color = Color.WHITE; p.style = Paint.Style.STROKE; p.strokeWidth = maxOf(3f, w * .004f)
                  cv.drawLine(cx - 2, hz, w * .13f, h, p); cv.drawLine(cx + 2, hz, w * .87f, h, p)
                  off = (off + speed * 0.004f) % 8f
                  for (i in 0 until 8) { val f = ((i + off) % 8f) / 8f; val y1 = hz + (h - hz) * f * f; val f2 = minOf(f + 0.05f, 1f); val y2 = hz + (h - hz) * f2 * f2
                      p.strokeWidth = 2f + w * .012f * f; cv.drawLine(cx, y1, cx, y2, p) }
                  p.style = Paint.Style.FILL
                  val sh = if (speed > 1) Math.sin(System.nanoTime() / 6e7).toFloat() * 1.5f else 0f
                  val cw = h * 0.1f; val ch = h * 0.3f; val top = h * 0.64f
                  p.color = 0xFFF5A623.toInt(); rr.set(cx - cw + sh, top, cx + cw + sh, top + ch); cv.drawRoundRect(rr, cw * .6f, cw * .6f, p)
                  p.color = 0xFF202020.toInt(); rr.set(cx - cw * .75f + sh, top + ch * .22f, cx + cw * .75f + sh, top + ch * .40f); cv.drawRoundRect(rr, 8f, 8f, p)
                  rr.set(cx - cw * .75f + sh, top + ch * .66f, cx + cw * .75f + sh, top + ch * .80f); cv.drawRoundRect(rr, 8f, 8f, p)
                  p.color = 0xFFFFC04D.toInt(); rr.set(cx - cw * .7f + sh, top + ch * .42f, cx + cw * .7f + sh, top + ch * .64f); cv.drawRoundRect(rr, 6f, 6f, p)
                  if (speed > 1) postInvalidateOnAnimation()
              }
          }
